name: Deploy MCP to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/generate-signing-key.mjs"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check
      - name: Require Cloudflare deployment secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - run: npx wrangler deploy
      - name: Provision stable evidence-signing key once
        shell: bash
        run: |
          set -euo pipefail
          secret_list="$RUNNER_TEMP/opstruth-secret-list.json"
          npx wrangler secret list > "$secret_list"
          if grep -q 'OPSTRUTH_RECEIPT_PRIVATE_KEY_PKCS8' "$secret_list" && grep -q 'OPSTRUTH_RECEIPT_PUBLIC_KEY_SPKI' "$secret_list"; then
            exit 0
          fi
          private_key="$RUNNER_TEMP/opstruth-private.pem"
          public_key="$RUNNER_TEMP/opstruth-public.pem"
          node scripts/generate-signing-key.mjs "$private_key" "$public_key"
          npx wrangler secret put OPSTRUTH_RECEIPT_PRIVATE_KEY_PKCS8 < "$private_key"
          npx wrangler secret put OPSTRUTH_RECEIPT_PUBLIC_KEY_SPKI < "$public_key"
          rm -f "$private_key" "$public_key" "$secret_list"
