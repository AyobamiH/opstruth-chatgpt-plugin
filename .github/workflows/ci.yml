name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm run check

  reconcile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/repair/repository-evidence-truth' && github.event.head_commit.message == 'Resolve carrier documentation conflicts in CI'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Merge current main and resolve the reviewed documentation conflict set
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            expected="$(printf '%s\n' docs/CURRENT-STATUS.md docs/release-0.4.0-runbook.md docs/release-readiness.md | sort)"
            if [ "$conflicts" != "$expected" ]; then
              echo "Unexpected merge conflict set:"
              printf '%s\n' "$conflicts"
              exit 2
            fi
          fi

          cat > docs/CURRENT-STATUS.md <<'EOF'
          # Current status

          As of 2026-09-01, OpsTruth `0.4.0` is publicly visible in the OpenAI Plugins Directory and deployed on its owned MCP domain. The currently deployed source remains commit `186ac58c7f76da942bb1b6bfc8c9b18bd2b812d5`; the P0 repair stack on PR #20 is not production evidence until it reaches `main`, deploys, and passes fresh read-back.

          ## Verified production identity

          - deployed Worker source commit: `186ac58c7f76da942bb1b6bfc8c9b18bd2b812d5`
          - exact-main CI: `https://github.com/AyobamiH/opstruth-chatgpt-plugin/actions/runs/33341464435` (`success`)
          - exact-main deployment workflow: `https://github.com/AyobamiH/opstruth-chatgpt-plugin/actions/runs/33341464399` (`success`)
          - deployment-log Worker version: `811fe35d-34a2-444f-a36f-a8421931ade2`
          - canonical endpoint: `https://mcp.opstruth.io/mcp`
          - compatibility endpoint: `https://opstruth-chatgpt.woeinvests.workers.dev/mcp`
          - public tool count: 21
          - workflow skill count: 6
          - authority mode: read-only public evidence
          - signer fingerprint: `sha256:09544c3ede70b832a114918bb439960004655faf9d36981e1402587af9429c86`

          The deployment workflow and public health read-back bind version `0.4.0`, 21 tools, Evidence Graph `1.0.0`, configured signing, and commit `186ac58c7f76da942bb1b6bfc8c9b18bd2b812d5`. The Cloudflare provider control plane was not independently read during this reconciliation, so the active provider version remains an owner-side read-back gate.

          ## Public channels

          - OpenAI Plugins Directory: public listing `OpsTruth`, version `0.4.0`, developer `AYOBAMI JOHN HAASTRUP`, direct listing `https://chatgpt.com/plugins/plugins_6a8d4dc60bf081918a06094873890eb4`.
          - OpenAI listing caveat: the visible metadata still links to the `workers.dev` compatibility origin. A clean-account install and real tool outcome remain unproven.
          - GitHub Marketplace: the separate `AyobamiH/opstruth` repository publishes the `OpsTruth evidence` Action at `v1.0.0`; `v1` and `v1.0.0` resolve to `45f4debbd3fbe8217599ab697b8f6c855b372e0b`.
          - Website channel: `opstruth.io` currently presents CLI version `0.2.0`, while the MCP and OpenAI channels present `0.4.0`. Channel-specific versions must be labelled and the website drift remains open.

          The Marketplace Action is not a release of this plugin repository. This repository currently has no GitHub tag, GitHub release, or GitHub deployment record.

          ## Active P0 repair program

          The open carrier PR #20 now contains the reconciled false-evidence repairs plus the stacked verifier work that was reviewed separately in #23 and #25. Until #20 reaches `main`, those changes remain candidate source rather than deployed truth.

          The carrier includes capability-specific migration completeness, exact-head GitHub outcome classification, scoped graph verdicts, the internal-versus-independent deployment smoke regression, a verifier-owned GitHub App read lane restricted to `AyobamiH/donestate`, and the complete `donestate.verification-contract.v2` response envelope with pinned shared vectors.

          ## DoneState bridge state

          Historical DoneState run `631d8a08-d337-4bae-bd18-b55c31f48a8b` remains valid historical `VERIFIED` evidence. Historical run `b4242932-0bc1-4876-a202-634d9c12d72a` remains unproven and must not be rewritten or retroactively trusted.

          The candidate verifier lane uses short-lived installation credentials, authenticated exact-head Metadata/Contents/Checks/Commit-status reads, strict repository identity and scope checks, and no anonymous or static-token success fallback. The candidate bridge returns the strict `{ contractVersion, report, attestation }` response required by DoneState. Neither capability is recorded as production-ready until the carrier is independently reviewed, merged to `main`, the GitHub App is correctly installed/configured, the exact main commit deploys, and a new consequence-disabled sealed canary reaches terminal read-back.

          DoneState PR #22 was owner-merged without public terminal verifier evidence. That owner action does not widen OpsTruth authority and does not verify the historical canary.

          ## Maintainer and release gates

          Maintainer bot v0 remains a deterministic, contents-read evidence source. It cannot approve, merge, deploy, release, or sign verification for its own change.

          `main` is currently unprotected, repository rulesets are not enforced, CODEOWNERS names only `@AyobamiH`, and no second trusted human reviewer is identified. Security, authentication, deployment, release, and evidence-contract changes require non-author human review before merge. A commit-bound tag and release must wait until the repaired deployed identity is reconciled to exact channel identities.

          ## Deferred scope

          Private-repository evidence brokerage, managed longitudinal storage, a verifier fleet, and higher maintainer write stages remain deferred. OpsTruth does not execute repair, merge, deployment, or release actions against inspected systems.
          EOF

          cat > docs/release-0.4.0-runbook.md <<'EOF'
          # OpsTruth 0.4.0 Release Runbook

          ## 1. Freeze the candidate

          Record the exact release commit. Require a clean worktree, `npm run check`, a successful Wrangler dry run and no drift in the sixteen 0.3.1 compatibility digests.

          ## 2. Provision the verification identity separately

          The owner creates a verifier-owned GitHub App that is separate from DoneState and any executor. Install it only on `AyobamiH/donestate` with Metadata read, Contents read, Checks read and Commit statuses read. Do not grant Actions, Pull requests, Deployments, Administration, Secrets, Workflows, Webhooks or any write permission. Review the endpoint map and failure behavior in [GitHub App verification read lane](github-app-verification.md).

          Configure `OPSTRUTH_GITHUB_APP_ID`, `OPSTRUTH_GITHUB_APP_INSTALLATION_ID` and `OPSTRUTH_GITHUB_APP_PRIVATE_KEY_PEM` directly as Cloudflare Worker secrets. Do not put their values in source, pull-request text, GitHub Actions secrets, command arguments, logs or test fixtures. Confirm that `wrangler.jsonc` still pins `OPSTRUTH_GITHUB_APP_ALLOWED_REPOSITORY` to `AyobamiH/donestate` and `OPSTRUTH_GITHUB_APP_ALLOWED_REPOSITORY_ID` to `1348643925`. Secret creation and App installation are owner-controlled external actions, not part of the repository merge.

          ## 3. Review through GitHub

          Open a pull request to `main`. CI and the deterministic maintainer review must pass on the exact unchanged head SHA. Authentication, architecture, contracts, workflows and authority-sensitive changes additionally require non-author human review; automated maintainer evidence is not a substitute.

          ## 4. Merge with SHA binding

          Merge only with the expected PR head SHA. Record the resulting main commit. Never treat the PR state alone as deployment evidence.

          ## 5. Deploy and verify

          The main-branch workflow must verify the three GitHub App Worker secret names before its first deploy, then deploy the Worker with the exact main commit identity. Require green post-merge CI and deployment, then independently check:

          - `/health`: version 0.4.0, 21 tools, Evidence Graph 1.0.0, exact commit and the safe GitHub verification tuple `github_app_installation / configured=true / selected_public_repository`;
          - `/mcp`: protocol-aware POST initialisation and complete read-only tool list; never use a generic GET health probe;
          - `/signing-key`: configured Ed25519 identity;
          - `/privacy`, `/terms` and `/support`: HTTP 200;
          - `/feedback`: controlled reason codes only;
          - live signed snapshot: correct graph schema, digest and signer fingerprint.

          The deployed regression must also invoke `opstruth_probe_deployment` from inside the Worker for `/health`, `/privacy`, `/terms`, and `/support`, probe the same routes independently from the workflow runner, and require matching successful status classes. Any internal 522, omitted route, transport ambiguity, or contradiction fails the deployment gate.

          After those gates pass, create a new consequence-disabled sealed DoneState canary against the exact selected repository and deployed verifier commit. Require authenticated metadata, commit, tree, compare, Contents, checks and status observations to bind to the sealed head, and require the complete `{ contractVersion, report, attestation }` response to pass DoneState's strict acceptance contract. Do not rerun, rewrite or retroactively trust historical run `b4242932-0bc1-4876-a202-634d9c12d72a` or PR #22.

          ## 6. Rotation, revocation and rollback

          For routine GitHub App key rotation, create a replacement key, update the Cloudflare Worker secret, pass health and a fresh canary, then revoke the prior key. For suspected compromise, revoke first, replace the secret, redeploy the reviewed commit and require a new run.

          If authentication, permission scope, boundary, compatibility, signing, graph-integrity, subject-binding, privacy or route smoke fails, stop DoneState verification and deploy only a reviewed version that fails closed. Never use the legacy static-token or anonymous verification lane as a success fallback. A rollback is a maintenance-plane deployment and must retain its own exact commit evidence.

          ## 7. OpenAI publication

          Repository merge, Cloudflare deployment, OpenAI review and visible directory publication are separate states. Confirm the visible directory version and canonical service metadata before announcing a repaired release identity.
          EOF

          cat > docs/release-readiness.md <<'EOF'
          # OpsTruth 0.4.0 Release Readiness
          Candidate: Evidence Graph release
          Authority: read-only evidence plane

          ## Release promise

          OpsTruth binds public repository, commit, CI, optional runtime and caller-supplied execution-receipt evidence to exact subjects. It preserves contradictions, reports proof gaps, produces portable signed snapshots, compares compatible snapshots and independently verifies execution outcomes without changing the target system.

          ## Implemented functionality

          - Evidence Graph v1 schema with 256-node, 512-edge and 512 KiB snapshot caps.
          - RFC 8785 JSON canonicalisation and domain-separated SHA-256 digests.
          - Ed25519 portable snapshot signing and offline verification.
          - Deterministic compatible-subject state deltas, including freshness expiry.
          - Six deterministic contradiction classes for commit, artifact, deployment, route, receipt and supersession conflicts.
          - Runtime schema validation for graphs and all four execution-handoff artifacts.
          - Real cryptographic vectors verified by the runtime implementation and a standalone verifier.
          - Independent post-execution verification with separate authorizer, executor and verifier identities and role-specific trust allowlists.
          - Fail-closed DoneState v2 handoff validation, exact-commit re-observation and domain-separated Ed25519 attestation signing.
          - Candidate verifier-owned GitHub App lane for installation-authenticated DoneState reads, restricted to one reviewed public repository with short-lived, scope-validated credentials.
          - Candidate complete `donestate.verification-contract.v2` response producer with byte-pinned DoneState report, attestation and deterministic positive/negative vectors.
          - Five additive read-only MCP tools: snapshot, compare, verify execution result, expose the public verifier identity and attest DoneState handoff.
          - Canonical compatibility locks for all sixteen 0.3.1 public tool contracts.
          - Analytics v2 and optional reason-coded feedback with no subject, prompt, URL, receipt, graph, free-text or user identifiers.
          - Controlled five-mode product-value evaluation protocol. Results remain explicitly unmeasured until the comparison is run.

          ## Security and privacy invariants

          - No public tool mutates a target repository, CI system, provider, deployment or runtime.
          - No public input accepts tokens, passwords, private keys or other credentials.
          - General public-repository tools remain anonymous; only the selected DoneState exact-commit bridge may use brokered Metadata, Contents, Checks and Commit-statuses read authority.
          - Private repository production access, provider-authenticated deployment verification, managed graph history and Executioner remain deferred.
          - Receipt state never determines the independent verification verdict.
          - Unknown signer trust, invalid signatures, stale evidence, incompatible subjects and proof gaps fail closed.
          - Global nonce reuse remains explicitly unproven in the stateless public plugin.
          - Graphs and protocol artifacts are returned to the caller and are not copied into analytics.

          ## Mandatory local and remote evidence

          - `npm run check` passes on the release commit.
          - The 0.3.1 tool-contract compatibility test passes.
          - Evidence schemas, structural examples and real cryptographic vectors pass.
          - Adversarial tamper, signer, subject, expiry, scope and contradiction tests pass.
          - Wrangler produces a deployable Worker bundle.
          - Pull-request CI and deterministic maintainer review pass on the exact head commit.
          - Non-author human review is recorded for authentication, architecture, contracts, workflows and authority-sensitive changes.
          - Post-merge CI and Cloudflare deployment pass on the exact main commit.
          - Deployment fails before its first write when the three required GitHub App Worker secret names are absent.
          - `/health` reports version `0.4.0`, 21 tools, Evidence Graph `1.0.0`, the exact deployed commit and configured selected-repository GitHub App verification.
          - `/mcp`, `/signing-key`, `/privacy`, `/terms`, `/support` and reason-coded feedback are freshly checked.
          - Internal Worker self-probes and independent runner probes agree for the required deployment routes.
          - A new consequence-disabled sealed DoneState canary verifies through authenticated exact-head reads and the complete versioned response contract; historical PR #22 remains unchanged.

          ## Publication separation

          Repository merge, Cloudflare deployment, OpenAI review, visible directory publication, clean-account installation, and a real tool outcome are separate states. Version `0.4.0` is visibly public in the OpenAI Plugins Directory as of 2026-09-01. Its listing still points to the compatibility origin, and clean-account installation and outcome remain unproven.

          ## Remaining non-code gates

          - Merge the reconciled P0 carrier to `main`, then deploy the exact main commit and pass the internal-versus-independent production regression.
          - Create and independently review the verifier-owned GitHub App, install it only on `AyobamiH/donestate`, and configure its three Cloudflare Worker secrets before the authenticated canary.
          - Obtain non-author architecture/security review for the authority-sensitive authentication, contract and deployment changes.
          - Run a fresh consequence-disabled DoneState canary only after exact-commit production read-back succeeds.
          - Identify a second trusted human reviewer, then protect `main` with exact PR checks and non-author human approval for protected changes.
          - Create a commit-bound plugin tag and release only after the repaired deployed identity is reconciled.
          - Run the controlled five-mode product-value comparison before making superiority claims.
          - Reconcile the OpenAI listing metadata from the compatibility origin to the reviewed canonical origin when the provider workflow permits it.
          EOF

          git add docs/CURRENT-STATUS.md docs/release-0.4.0-runbook.md docs/release-readiness.md
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Unresolved merge conflicts remain"
            git diff --name-only --diff-filter=U
            exit 3
          fi
      - name: Validate merged tree
        run: |
          npm run check
          git diff --check
          git diff --cached --check
      - name: Publish reconciled carrier only after green gate
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "Reconcile verifier stack with main"
          git push origin "HEAD:${GITHUB_REF_NAME}"
