name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm run check

  reconcile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/repair/repository-evidence-truth' && github.event.head_commit.message == 'Stage carrier reconciliation in CI'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Merge current main fail-closed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge --no-commit --no-ff origin/main; then
            echo "Conflict files:"
            git diff --name-only --diff-filter=U
            git status --short
            exit 2
          fi
      - name: Validate merged tree
        run: |
          npm run check
          git diff --check
          git diff --cached --check
      - name: Publish reconciled carrier only after green gate
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "Reconcile verifier stack with main"
          git push origin "HEAD:${GITHUB_REF_NAME}"
