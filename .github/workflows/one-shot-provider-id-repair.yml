name: Build bounded provider repository ID repair
on:
  push:
    branches: [repair/donestate-provider-repository-id]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message == 'Prepare bounded DoneState provider repository ID repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/donestate-provider-repository-id
          fetch-depth: 0
      - name: Apply exact-commit verifier identity repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('src/github.js')
          text = source.read_text()
          marker = 'export async function loadCommitVerificationEvidence'
          before, sep, after = text.partition(marker)
          if not sep:
              raise SystemExit('loadCommitVerificationEvidence marker missing')
          old = 'providerRepositoryId: metadata.id === undefined || metadata.id === null ? null : String(metadata.id),'
          new = 'providerRepositoryId: metadata.id === undefined || metadata.id === null ? null : Number(metadata.id),'
          if after.count(old) != 1:
              raise SystemExit(f'expected one exact-commit provider ID conversion, found {after.count(old)}')
          source.write_text(before + sep + after.replace(old, new, 1))

          test = Path('test/github-verification-auth.test.js')
          text = test.read_text()
          anchor = '    assert.equal(evidence.files[0].text, CONTENT);\n'
          addition = anchor + '    assert.equal(evidence.repository.providerRepositoryId, 424242);\n    assert.equal(typeof evidence.repository.providerRepositoryId, "number");\n'
          if text.count(anchor) != 1:
              raise SystemExit('verification evidence assertion anchor missing')
          test.write_text(text.replace(anchor, addition, 1))

          status = Path('docs/CURRENT-STATUS.md')
          text = status.read_text()
          note = '''\n\n## 2026-09-03 DoneState v2 repository-subject identity repair\n\n- Production DoneState canary #114 reached OpsTruth v2 after its exact-head CI passed, and the deployed verifier returned HTTP 200.\n- DoneState correctly rejected the response because `report.subject.providerRepositoryId` was a string even though the shared verification-report schema requires an integer or null.\n- Root cause is isolated to the exact-commit GitHub verification evidence adapter: GitHub supplies a numeric repository ID, but OpsTruth converted it with `String(metadata.id)` before building the signed report.\n- This repair converts only the exact-commit verification evidence repository ID to `Number(metadata.id)` and adds a regression assertion that the value remains numeric. General repository-audit snapshot semantics are unchanged.\n- Completion remains unproven until this source revision passes the full repository check, is deployed, and a fresh DoneState canary reaches the complete sealed-handoff -> OpsTruth v2 -> DoneState `VERIFIED` chain.\n'''
          if '## 2026-09-03 DoneState v2 repository-subject identity repair' in text:
              raise SystemExit('status repair note already exists')
          status.write_text(text.rstrip() + note)
          PY
          git rm .github/workflows/one-shot-provider-id-repair.yml
          git diff --check
      - name: Run full repository check
        run: npm run check
      - name: Commit bounded repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ayobami Haastrup"
          git config user.email "47716486+AyobamiH@users.noreply.github.com"
          git add src/github.js test/github-verification-auth.test.js docs/CURRENT-STATUS.md
          git commit -m "Keep DoneState verifier repository ID numeric"
          git push origin HEAD:repair/donestate-provider-repository-id
