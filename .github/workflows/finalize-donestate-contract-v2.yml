name: Finalize DoneState verification contract v2

on:
  push:
    branches:
      - repair/donestate-verification-contract-v2-r2

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Mirror merged DoneState contract artifacts
        shell: bash
        run: |
          set -euo pipefail
          source_commit=9e33a7e4c8505eabd24df775e8292bfaa2906f43
          base="https://raw.githubusercontent.com/AyobamiH/donestate/${source_commit}/schemas"
          mkdir -p contracts/donestate/vectors
          curl --fail --silent --show-error --location "$base/verification-response-v2.schema.json" -o contracts/donestate/verification-response-v2.schema.json
          curl --fail --silent --show-error --location "$base/verification-report-v1.schema.json" -o contracts/donestate/verification-report-v1.schema.json
          curl --fail --silent --show-error --location "$base/verification-attestation-v2.schema.json" -o contracts/donestate/verification-attestation-v2.schema.json
          for name in verified failed uncertain negative; do
            curl --fail --silent --show-error --location "$base/vectors/verification-contract-v2-${name}.json" -o "contracts/donestate/vectors/verification-contract-v2-${name}.json"
          done
      - name: Bind runtime and provenance to the complete response contract
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import json
          from pathlib import Path

          source = Path("src/donestate.js")
          text = source.read_text()
          marker = 'const HANDOFF_DOMAIN = "donestate.verification-handoff.v2\\0";'
          replacement = 'export const DONESTATE_VERIFICATION_CONTRACT_VERSION = "donestate.verification-contract.v2";\n\n' + marker
          if 'export const DONESTATE_VERIFICATION_CONTRACT_VERSION' not in text:
              if text.count(marker) != 1:
                  raise SystemExit("DoneState contract-version insertion point drifted")
              text = text.replace(marker, replacement)
          old_return = '  return { report, attestation };'
          new_return = '  return { contractVersion: DONESTATE_VERIFICATION_CONTRACT_VERSION, report, attestation };'
          if old_return in text:
              text = text.replace(old_return, new_return, 1)
          elif new_return not in text:
              raise SystemExit("DoneState verification response return point drifted")
          source.write_text(text)

          tests = Path("test/donestate.test.js")
          text = tests.read_text()
          old = '''    const verification = await verifyDoneStateHandoff(await handoff(), verificationEnv(), {}, { observedAt: OBSERVED_AT });\n    assert.equal(verification.report.decision, "verified");'''
          new = '''    const verification = await verifyDoneStateHandoff(await handoff(), verificationEnv(), {}, { observedAt: OBSERVED_AT });\n    assert.deepEqual(Object.keys(verification).sort(), ["attestation", "contractVersion", "report"]);\n    assert.equal(verification.contractVersion, "donestate.verification-contract.v2");\n    assert.equal(verification.report.decision, "verified");'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'assert.equal(verification.contractVersion, "donestate.verification-contract.v2")' not in text:
              raise SystemExit("DoneState runtime contract test insertion point drifted")
          old = '    assert.equal(response.structuredContent.report.decision, "verified");'
          new = '    assert.equal(response.structuredContent.contractVersion, "donestate.verification-contract.v2");\n    assert.equal(response.structuredContent.report.decision, "verified");'
          if old in text:
              text = text.replace(old, new, 1)
          elif 'response.structuredContent.contractVersion' not in text:
              raise SystemExit("DoneState MCP contract test insertion point drifted")
          tests.write_text(text)

          provenance_path = Path("provenance/sources.json")
          provenance = json.loads(provenance_path.read_text())
          source_entry = next((item for item in provenance["sources"] if item.get("repository") == "https://github.com/AyobamiH/donestate"), None)
          if source_entry is None:
              raise SystemExit("DoneState provenance entry missing")
          source_entry.update({
              "commit": "9e33a7e4c8505eabd24df775e8292bfaa2906f43",
              "version": "verification-contract-v2",
              "license": "Apache-2.0",
              "role": "DoneState v2 handoff plus complete verification response contract, strict report/attestation schemas and deterministic verifier vectors",
              "integration": "independent read-only verifier adapter with byte-identical contract mirror",
              "modifiedUpstream": False,
          })
          provenance_path.write_text(json.dumps(provenance, indent=2) + "\n")

          docs = Path("docs/contracts/donestate-bridge-v1.md")
          doc = docs.read_text()
          section = '''\n\n## Complete verification response contract v2\n\nThe current DoneState acceptance boundary requires one strict response envelope: `{ contractVersion, report, attestation }`, with `contractVersion` fixed to `donestate.verification-contract.v2`. OpsTruth now returns that complete envelope from `opstruth_attest_donestate_handoff`; it does not submit the response back to DoneState or mutate the inspected repository.\n\nThe schemas and deterministic `verified`, `failed`, `uncertain`, and negative vectors under `contracts/donestate/` are byte-identical mirrors of DoneState merge commit `9e33a7e4c8505eabd24df775e8292bfaa2906f43` (PR #63). `contracts/donestate/manifest.json` pins the upstream Git blob SHA for every mirrored artifact, and the test suite recomputes those blob identities before consuming the vectors. The older `contracts/vectors/donestate-v2.json` remains a historical handoff/attestation compatibility vector; it is not the complete v2 response contract.\n\nThe deterministic vector signer is test-only and has no production authority. Production continues to sign with the independently provisioned OpsTruth Ed25519 identity. Signer rotation, revocation, replay acceptance, freshness enforcement, and DoneState state transitions remain DoneState acceptance responsibilities; OpsTruth's producer responsibility is to emit a complete, internally bound, signed response from fresh read-only evidence.\n'''
          if '## Complete verification response contract v2' not in doc:
              docs.write_text(doc.rstrip() + section + "\n")
          PY
      - name: Write contract mirror manifest and vector-consumer regression
        shell: bash
        run: |
          set -euo pipefail
          cat > contracts/donestate/manifest.json <<'JSON'
          {
            "schemaVersion": "1.0.0",
            "sourceRepository": "https://github.com/AyobamiH/donestate",
            "sourceCommit": "9e33a7e4c8505eabd24df775e8292bfaa2906f43",
            "sourcePullRequest": 63,
            "artifacts": {
              "verification-response-v2.schema.json": "2e1b893609591938b1cb69e26939d842967762c3",
              "verification-report-v1.schema.json": "d01912f824c39534c9607a5b37fc193046d9581e",
              "verification-attestation-v2.schema.json": "f49c361bcd954e50be773cb9afff79000b58aadc",
              "vectors/verification-contract-v2-verified.json": "bd2e4bd51997a453894050defee7125e38180649",
              "vectors/verification-contract-v2-failed.json": "6fb3e203276c7718fa5c6b28bd6428a668b26256",
              "vectors/verification-contract-v2-uncertain.json": "cecd856508a21a0d0c2de2b55c3b15a8ed02ac9d",
              "vectors/verification-contract-v2-negative.json": "06a1566827fb001bc7dbbf331ad29a16ea4d2623"
            }
          }
          JSON
          cat > test/donestate-verification-contract-v2.test.js <<'JS'
          import assert from "node:assert/strict";
          import { createHash, createPublicKey, verify } from "node:crypto";
          import { readFile } from "node:fs/promises";
          import test from "node:test";
          import { canonicalJson } from "../src/canonical.js";
          import { validateAgainstSchema } from "../scripts/validate-contracts.mjs";

          const root = new URL("../contracts/donestate/", import.meta.url);
          const readJson = async (path) => JSON.parse(await readFile(new URL(path, root), "utf8"));
          const readBytes = async (path) => readFile(new URL(path, root));

          function gitBlobSha(bytes) {
            return createHash("sha1").update(`blob ${bytes.length}\0`).update(bytes).digest("hex");
          }

          function sha256(value) {
            return createHash("sha256").update(value).digest("hex");
          }

          function responseErrors(response, responseSchema, reportSchema, attestationSchema) {
            const errors = [];
            const allowed = new Set(Object.keys(responseSchema.properties));
            for (const field of responseSchema.required) {
              if (!Object.hasOwn(response, field)) errors.push(`$.${field}: required property missing`);
            }
            for (const field of Object.keys(response)) {
              if (!allowed.has(field)) errors.push(`$.${field}: unknown property`);
            }
            if (response.contractVersion !== responseSchema.properties.contractVersion.const) {
              errors.push("$.contractVersion: const mismatch");
            }
            if (response.report) errors.push(...validateAgainstSchema(response.report, reportSchema, reportSchema, "$.report"));
            if (response.attestation) errors.push(...validateAgainstSchema(response.attestation, attestationSchema, attestationSchema, "$.attestation"));
            return errors;
          }

          async function verifyVector(vector, expectedDecision, schemas) {
            assert.equal(vector.schemaVersion, "2.0.0");
            assert.equal(vector.response.contractVersion, "donestate.verification-contract.v2");
            assert.equal(vector.response.report.decision, expectedDecision);
            assert.equal(vector.response.attestation.decision, expectedDecision);
            assert.deepEqual(responseErrors(vector.response, ...schemas), []);

            const handoff = { ...vector.handoff };
            delete handoff.handoffDigest;
            assert.equal(
              vector.handoff.handoffDigest,
              sha256(`donestate.verification-handoff.v2\0${canonicalJson(handoff)}`),
            );
            assert.equal(vector.response.report.runId, vector.handoff.runId);
            assert.equal(vector.response.report.handoffDigest, vector.handoff.handoffDigest);
            assert.equal(vector.response.report.verificationNonce, vector.handoff.verificationNonce);
            assert.equal(vector.response.attestation.runId, vector.handoff.runId);
            assert.equal(vector.response.attestation.handoffDigest, vector.handoff.handoffDigest);
            assert.equal(vector.response.attestation.verificationNonce, vector.handoff.verificationNonce);
            assert.equal(
              vector.response.attestation.verificationReportDigest,
              sha256(`opstruth.donestate-verification-report.v1\0${canonicalJson(vector.response.report)}`),
            );

            const { signature, ...unsigned } = vector.response.attestation;
            const publicKey = createPublicKey(signature.publicKeyPem);
            const der = publicKey.export({ type: "spki", format: "der" });
            assert.equal(signature.signerFingerprint, sha256(der));
            assert.equal(
              verify(
                null,
                Buffer.from(`donestate.verification-attestation.v2\0${canonicalJson(unsigned)}`),
                publicKey,
                Buffer.from(signature.signatureBase64, "base64"),
              ),
              true,
            );
          }

          test("OpsTruth consumes the byte-identical DoneState verification contract v2 corpus", async () => {
            const manifest = await readJson("manifest.json");
            assert.equal(manifest.sourceCommit, "9e33a7e4c8505eabd24df775e8292bfaa2906f43");
            for (const [path, expectedBlob] of Object.entries(manifest.artifacts)) {
              assert.equal(gitBlobSha(await readBytes(path)), expectedBlob, `${path} drifted from DoneState`);
            }

            const responseSchema = await readJson("verification-response-v2.schema.json");
            const reportSchema = await readJson("verification-report-v1.schema.json");
            const attestationSchema = await readJson("verification-attestation-v2.schema.json");
            const schemas = [responseSchema, reportSchema, attestationSchema];
            await verifyVector(await readJson("vectors/verification-contract-v2-verified.json"), "verified", schemas);
            await verifyVector(await readJson("vectors/verification-contract-v2-failed.json"), "failed", schemas);
            await verifyVector(await readJson("vectors/verification-contract-v2-uncertain.json"), "uncertain", schemas);
          });

          test("OpsTruth consumes the complete DoneState negative mutation catalogue and rejects strict-envelope drift", async () => {
            const responseSchema = await readJson("verification-response-v2.schema.json");
            const reportSchema = await readJson("verification-report-v1.schema.json");
            const attestationSchema = await readJson("verification-attestation-v2.schema.json");
            const schemas = [responseSchema, reportSchema, attestationSchema];
            const negative = await readJson("vectors/verification-contract-v2-negative.json");
            const ids = negative.mutations.map((mutation) => mutation.id).sort();
            assert.deepEqual(ids, [
              "altered_handoff",
              "decision_mismatch",
              "extra_attestation_field",
              "extra_response_field",
              "extra_signature_field",
              "future_observation",
              "missing_requirement",
              "replayed_nonce",
              "revoked_signer",
              "stale_observation",
              "unsupported_contract",
            ]);

            const verified = await readJson("vectors/verification-contract-v2-verified.json");
            for (const id of ["unsupported_contract", "extra_response_field", "extra_attestation_field", "extra_signature_field"]) {
              const mutation = negative.mutations.find((item) => item.id === id);
              const response = structuredClone(verified.response);
              if (id === "unsupported_contract") response.contractVersion = mutation.value;
              if (id === "extra_response_field") response.unsupported = mutation.value;
              if (id === "extra_attestation_field") response.attestation.unsupported = mutation.value;
              if (id === "extra_signature_field") response.attestation.signature.unsupported = mutation.value;
              assert.notDeepEqual(responseErrors(response, ...schemas), [], `${id} must fail closed`);
            }
          });
          JS
      - name: Validate complete repository gates
        run: |
          npm run check
          git diff --check
      - name: Commit review candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/donestate.js test/donestate.test.js test/donestate-verification-contract-v2.test.js contracts/donestate provenance/sources.json docs/contracts/donestate-bridge-v1.md
          if git diff --cached --quiet; then
            echo "No substantive changes to commit"
            exit 0
          fi
          git commit -m "Align OpsTruth with DoneState verification contract v2"
          git push origin "HEAD:${GITHUB_REF_NAME}"
